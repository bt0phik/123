name: Build FarSight LOD

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: farsight
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FarSightLOD-JAR
          path: farsight/build/libs/*.jar
